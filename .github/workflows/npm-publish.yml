name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build project
        run: npm run build --if-present

      # A prerelease (1.1.0-beta.1) must stay off `latest`, while a release has to land on it —
      # 1.0.0 was published with a hard-coded `--tag beta` and left `latest` on an old beta.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          echo "Publishing $VERSION with dist-tag $TAG"
          npm publish --tag "$TAG"
